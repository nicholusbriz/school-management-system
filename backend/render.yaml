services:
  # Backend API Service
  - type: web
    name: school-management-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm run dev
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
